# Development services for X-Brand-Pro.
# Used by `pnpm services:up` (scripts/services.mjs).
# NEVER use `latest` tags — versions are pinned and recorded in docs/DECISIONS.md.

name: app-dev

services:
  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: app-dev-db
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app_dev_password
      POSTGRES_DB: app
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d app']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    container_name: app-dev-redis
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:1.20
    container_name: app-dev-mailpit
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8025/ >/dev/null 2>&1 || exit 1']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Self-hosted basemap tiles (I3.1) — nginx range-serving the PMTiles
  # archive, glyph PBFs, sprite sheets and the two styles from one origin.
  # The PMTiles archive itself is machine-local (see infra/tiles/README.md);
  # styles/fonts/sprites are committed and serve regardless.
  tiles:
    image: nginx:1.28-alpine
    container_name: app-dev-tiles
    ports:
      - '127.0.0.1:8080:8080'
    volumes:
      - ./tiles/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./tiles:/usr/share/nginx/html:ro
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8080/style.json >/dev/null 2>&1 || exit 1']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  db_data:
  redis_data:
