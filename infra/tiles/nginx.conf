# infra/tiles/nginx.conf — the self-hosted tiles stack (I3.1).
#
# One origin serving four things (all under one root, matching the relative
# references baked into style.json / style.dark.json):
#   /style.json, /style.dark.json      MapLibre styles (no-cache — small, rebuildable)
#   /tiles/iran.pmtiles                the basemap PMTiles archive (range-served)
#   /fonts/<stack>/<range>.pbf         glyph PBFs (immutable)
#   /sprites/sprite(@2x).{png,json}    sprite sheets (immutable)
#
# PMTiles works over PLAIN static hosting: the client (pmtiles protocol in
# MapLibre, registered by F3.1) issues HTTP Range requests against the
# archive and reads the directory from the trailing index. The only server
# requirement is byte-range support — nginx static files support it natively
# (Accept-Ranges: bytes); the extra config below makes the behavior explicit
# and cached correctly.

server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index style.json;

    # PMTiles + glyphs + sprites are cross-origin consumed by the web app
    # (web :3000 → tiles :8080 in dev; same origin behind the reverse proxy
    # in production). No credentials are involved — the tiles stack is public
    # by design (DECISIONS 2026-11-09 I3.1).
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Range, Origin, Accept" always;
    add_header Access-Control-Expose-Headers "Accept-Ranges, Content-Length, Content-Range, Content-Encoding, ETag" always;

    # 204 preflights only need the headers above.
    if ($request_method = OPTIONS) {
        return 204;
    }

    # Byte ranges for PMTiles (the client fetches ~16KB windows, not the
    # whole archive) — explicit Accept-Ranges + no gzip (pmtiles blocks are
    # internally compressed; gzip wastes CPU and breaks nothing but gains
    # nothing) + immutable caching (the archive is versioned by filename).
    location /tiles/ {
        add_header Accept-Ranges bytes always;
        gzip off;
        add_header Cache-Control "public, max-age=86400" always;
        # Re-emit CORS headers inside location blocks (add_header inheritance
        # stops at the first directive here).
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Expose-Headers "Accept-Ranges, Content-Length, Content-Range, ETag" always;
    }

    # Glyph PBFs and sprites are immutable build artifacts — cache hard.
    location /fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        gzip off;
    }
    location /sprites/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        gzip off;
    }

    # Styles are tiny and regenerate with TILES_PUBLIC_URL — keep them fresh.
    location ~* ^/style(\.dark)?\.json$ {
        add_header Cache-Control "no-cache" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Content-Type "application/json" always;
    }

    # Directory listing off; 404s stay JSON-less and boring.
    autoindex off;
}
