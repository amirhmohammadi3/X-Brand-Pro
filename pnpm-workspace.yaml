packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  '@parcel/watcher': true
  '@scarf/scarf': true
  '@swc/core': true
  argon2: true
  esbuild: true
  msgpackr-extract: true

minimumReleaseAgeExclude:
